    <script>
      (() => {
        try {
          const themes = ['tokyo-night', 'gruvbox-dark', 'catppuccin-mocha', 'nord', 'phosphor', 'amber', 'light'];
          const stored = localStorage.getItem('sahil.tui.theme');
          const theme = themes.includes(stored) ? stored : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'tokyo-night');
          document.documentElement.dataset.theme = theme;
          const colors = {
            'tokyo-night': '#1a1b26', 'gruvbox-dark': '#282828', 'catppuccin-mocha': '#1e1e2e',
            nord: '#2e3440', phosphor: '#030803', amber: '#0b0803', light: '#eff1f5',
          };
          document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme]);
          document.documentElement.style.backgroundColor = colors[theme];
        } catch (_) { /* Theme storage is optional. */ }
      })();
    </script>
